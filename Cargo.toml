[package]
name = "mcping"
version = "0.1.4"
edition = "2021"
description = "Minecraft Java/Bedrock server ping CLI (SLP + RakNet Unconnected Ping)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CntierTeam/mcping"
homepage = "https://github.com/CntierTeam/mcping"
keywords = ["minecraft", "ping", "bedrock", "slp", "raknet"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "mcping"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: read system DNS for SRV (Unix uses /etc/resolv.conf).
[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"

[package.metadata.deb]
maintainer = "CntierTeam <noreply@cntier.club>"
copyright = "2026 CntierTeam"
license-file = ["LICENSE", "0"]
extended-description = """\
Minecraft Java/Bedrock server ping CLI.
Java: Server List Ping (TCP 1.7+) with _minecraft._tcp SRV lookup.
Bedrock: RakNet Unconnected Ping/Pong (UDP, default port 19132).
"""
section = "net"
priority = "optional"
assets = [
  ["target/release/mcping", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/mcping/", "644"],
  ["LICENSE", "usr/share/doc/mcping/", "644"],
]
