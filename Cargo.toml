[package]
name = "mcping"
version = "0.1.0"
edition = "2021"
description = "Minecraft Java/Bedrock server ping CLI (SLP + RakNet Unconnected Ping)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/CntierTeam/mcping"
homepage = "https://github.com/CntierTeam/mcping"
keywords = ["minecraft", "ping", "bedrock", "slp", "raknet"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "mcping"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hickory-resolver = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.deb]
maintainer = "CntierTeam <noreply@cntier.club>"
copyright = "2026 CntierTeam"
license-file = ["LICENSE", "0"]
extended-description = """\
Minecraft Java/Bedrock server ping CLI.
Java: Server List Ping (TCP 1.7+) with _minecraft._tcp SRV lookup.
Bedrock: RakNet Unconnected Ping/Pong (UDP, default port 19132).
"""
section = "net"
priority = "optional"
assets = [
  ["target/release/mcping", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/mcping/", "644"],
  ["LICENSE", "usr/share/doc/mcping/", "644"],
]
